name: Release security validation
on:
  pull_request:
    branches: ["release/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [unit, vitest, build]
    env:
      OMNIROUTE_SKIP_SYSTEM_TRUST: "1"
      DISABLE_SQLITE_AUTO_BACKUP: "true"
      DATA_DIR: ${{ runner.temp }}/omniroute-security
      OMNIROUTE_BUILD_MEMORY_MB: "4096"
      OMNIROUTE_BUILD_WORKERS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: npm ci
      - name: Run full unit suite
        if: matrix.check == 'unit'
        run: npm run test:unit:ci
      - name: Run Vitest suite
        if: matrix.check == 'vitest'
        run: npm run test:vitest
      - name: Build production application
        if: matrix.check == 'build'
        run: npm run build
